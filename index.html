<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双金属温度计面板生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>双金属温度计面板生成器</h1>

    <div class="config-panel">
        <fieldset>
            <legend>基本设置</legend>

            <label for="dial-size">选择尺寸:</label>
            <select id="dial-size">
                <option value="60">Φ60</option>
                <option value="100" selected>Φ100</option> <!-- Default to 100 -->
                <option value="150">Φ150</option>
            </select>

            <label>选择面板形式:</label>
            <!-- Changed radio buttons: value is now just the suffix -->
            <input type="radio" id="model-wss-01" name="panel-model-suffix" value="01" checked>
            <label for="model-wss-01">WSS-x01</label> <!-- Label shows placeholder 'x' -->
            <input type="radio" id="model-wss-11" name="panel-model-suffix" value="11">
            <label for="model-wss-11">WSS-x11</label>
            <input type="radio" id="model-wss-81" name="panel-model-suffix" value="81">
            <label for="model-wss-81">WSS-x81</label>

            <!-- 修改: 标签改为“公司名称”，添加 value 默认值 -->
            <label for="company-name">公司名称:</label>
            <input type="text" id="company-name" value="安徽运诚科技集团有限公司">

            <label for="product-no">产品编号:</label>
            <input type="text" id="product-no" placeholder="可选">

            <label for="initial-chord-length">初始弦长:</label> <!-- Renamed ID for clarity -->
            <input type="number" id="initial-chord-length" value="110.5" step="any" placeholder="可选,优先使用分段">
             <!-- Example default for 100mm/270deg -->
        </fieldset>

        <fieldset>
            <legend>温度范围</legend>
             <div id="temp-ranges">
                 <!-- Options remain the same, ensure default 'checked' is logical -->
                 <input type="radio" id="range-m40_80" name="temp-range" value="-40,80" data-min="-40" data-max="80"> <label for="range-m40_80">-40~80℃</label><br>
                 <input type="radio" id="range-0_50" name="temp-range" value="0,50" data-min="0" data-max="50"> <label for="range-0_50">0~50℃</label><br>
                 <input type="radio" id="range-0_100" name="temp-range" value="0,100" data-min="0" data-max="100" checked> <label for="range-0_100">0~100℃</label><br> <!-- Default to 0-100 -->
                 <input type="radio" id="range-0_150" name="temp-range" value="0,150" data-min="0" data-max="150"> <label for="range-0_150">0~150℃</label><br>
                 <input type="radio" id="range-0_200" name="temp-range" value="0,200" data-min="0" data-max="200"> <label for="range-0_200">0~200℃</label><br>
                 <input type="radio" id="range-0_300" name="temp-range" value="0,300" data-min="0" data-max="300"> <label for="range-0_300">0~300℃</label><br>
                 <input type="radio" id="range-0_400" name="temp-range" value="0,400" data-min="0" data-max="400"> <label for="range-0_400">0~400℃</label><br>
                 <input type="radio" id="range-0_500" name="temp-range" value="0,500" data-min="0" data-max="500"> <label for="range-0_500">0~500℃</label><br>
                 <input type="radio" id="range-0_350" name="temp-range" value="0,350" data-min="0" data-max="350"> <label for="range-0_350">0~350℃</label><br>
             </div>
        </fieldset>

        <fieldset>
            <legend>标度区间 (定义每段温度范围对应的弦长)</legend>
            <div id="scale-intervals">
                <!-- Content generated by JavaScript -->
            </div>
            <small>注意: 这些弦长指区间两端刻度延长到圆边后的直线距离。优先使用此处的值计算角度。</small>
        </fieldset>

        <button id="generate-btn">生成预览</button>
        <button id="download-btn">下载 SVG</button>
    </div>

    <div class="preview-panel">
        <h2>预览</h2>
        <div id="svg-preview">
            <!-- SVG will be rendered here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
